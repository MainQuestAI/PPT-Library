[project]
name = "ppt-library"
version = "1.4.0"
description = "Local-first CLI for indexing, searching, reviewing, and reusing PPTX slide assets with AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "MainQuest AI" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = [
  "defusedxml>=0.7.1",
  "numpy>=2.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "watchdog>=4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
lint = [
  "mypy>=1.10",
  "ruff>=0.8",
]
demo = [
  "python-pptx>=1.0",
]

[project.scripts]
ppt-lib = "ppt_lib.cli:main"

[project.urls]
Homepage = "https://github.com/MainQuestAI/PPT-Library"
Repository = "https://github.com/MainQuestAI/PPT-Library"
Issues = "https://github.com/MainQuestAI/PPT-Library/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppt_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["ppt_lib"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
