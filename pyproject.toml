[project]
name = "ppt-library"
version = "2.0.1.dev0"
description = "Local-first CLI for indexing, searching, reviewing, and reusing PPTX slide assets with AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "MainQuest AI" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = [
  "defusedxml>=0.7.1",
  "filelock>=3.16",
  "jsonschema>=4.23",
  "numpy>=2.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "watchdog>=4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
]
lint = [
  "mypy>=1.10",
  "ruff>=0.8",
]
demo = [
  "python-pptx>=1.0",
]
paddleocr = [
  "paddleocr-mcp>=0.8.2",
]
workbench = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "httpx2>=0.6",
]
security = [
  "bandit>=1.8",
  "pip-audit>=2.9",
]

[project.scripts]
ppt-lib = "ppt_lib.cli:main"

[project.urls]
Homepage = "https://github.com/MainQuestAI/PPT-Library"
Repository = "https://github.com/MainQuestAI/PPT-Library"
Issues = "https://github.com/MainQuestAI/PPT-Library/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppt_lib"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.en.md",
  "/README.md",
  "/SECURITY.md",
  "/VERSION",
  "/docs",
  "/ppt_lib",
  "/pyproject.toml",
  "/scripts",
  "/skills",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() in argument defaults is the framework's standard pattern
"ppt_lib/api_server.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["ppt_lib"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
